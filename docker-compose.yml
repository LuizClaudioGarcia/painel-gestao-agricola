services:
  postgres:
    image: postgres:16
    container_name: agrotis-postgres
    environment:
      POSTGRES_DB: agrotis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agrotis"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - agrotis-pg:/var/lib/postgresql/data

volumes:
  agrotis-pg:
